    <title>Detail Dogs LLC | Site Under Construction</title>
    <meta name="description" content="Detail Dogs LLC is currently updating the website. Call or email to book service.">
    <style>
        :root {
            --bg: #050b16;
            --navy: #071426;
            --red: #ff1f4f;
            --blue: #006fe8;
            --teal: #18f0e4;
            --orange: #ff7a00;
            --text: #fbfdff;
            --muted: #c1d0dc;
            --glass: rgba(226, 233, 238, 0.1);
            --line: rgba(24, 240, 228, 0.34);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            display: grid;
            place-items: center;
            padding: 2rem;
            background:
                linear-gradient(180deg, rgba(185, 195, 205, 0.16), rgba(74, 88, 102, 0.1) 44%, rgba(157, 169, 179, 0.08)),
                radial-gradient(circle at 76% 8%, rgba(24, 240, 228, 0.36), transparent 32rem),
                radial-gradient(circle at 8% 42%, rgba(255, 31, 79, 0.32), transparent 30rem),
                radial-gradient(circle at 24% 82%, rgba(255, 122, 0, 0.22), transparent 26rem),
                radial-gradient(circle at 78% 78%, rgba(0, 111, 232, 0.58), transparent 36rem),
                linear-gradient(180deg, var(--navy) 0%, var(--bg) 52%, var(--navy) 100%);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .construction-card {
            width: min(680px, 100%);
            padding: clamp(2rem, 6vw, 4rem);
            border: 1px solid var(--line);
            background: linear-gradient(135deg, rgba(226, 233, 238, 0.11), rgba(255, 31, 79, 0.13), rgba(255, 122, 0, 0.1), rgba(0, 111, 232, 0.18));
            box-shadow: 0 26px 80px rgba(0, 0, 0, 0.36), 0 0 42px rgba(24, 240, 228, 0.12);
            backdrop-filter: blur(18px);
        }

        .logo-mark {
            display: block;
            width: min(300px, 74vw);
            margin: 0 auto 1.35rem;
            filter: drop-shadow(0 18px 48px rgba(0, 0, 0, 0.5)) drop-shadow(0 0 34px rgba(0, 111, 232, 0.32));
        }

        .status {
            margin: 0;
            color: var(--text);
            font-size: clamp(1.5rem, 5vw, 2.6rem);
            font-weight: 900;
            text-transform: uppercase;
        }

        .note {
            max-width: 34rem;
            margin: 1rem auto 0;
            color: var(--muted);
            font-size: 1rem;
            line-height: 1.7;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 1.8rem;
        }

        .action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            padding: 0.8rem 1.1rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: var(--text);
            font-weight: 800;
            line-height: 1.2;
            text-decoration: none;
        }

        .action-primary {
            background: linear-gradient(135deg, var(--red), var(--orange) 48%, var(--blue));
        }

        .action-secondary {
            background: rgba(7, 20, 38, 0.56);
            border-color: var(--line);
        }

        @media (max-width: 520px) {
            body {
                padding: 1rem;
            }

            .construction-card {
                padding: 2rem 1.1rem;
            }

            .actions {
                display: grid;
            }
        }
    </style>
</head>
